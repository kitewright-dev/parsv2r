name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The stable release aether's own release workflow built with; pinned so a new stable
      # release cannot change or break the release build on its own. Bump it together with
      # the aether submodule.
      RUST_TOOLCHAIN: "1.98.1"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    # Compose's painterResource only draws vectors and bitmaps. A launcher mipmap resolves to
    # the adaptive-icon xml on Android 8+ and throws at runtime, which the build never sees.
    # v2.3.8-pars2 shipped exactly that and crashed on launch.
    - name: Refuse painterResource on launcher mipmaps
      run: |
        if grep -rn 'painterResource(R\.mipmap\.' V2rayNG/app/src; then
          echo "painterResource cannot draw an adaptive icon, use a raster in res/drawable-nodpi"
          exit 1
        fi
        echo "ok"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Restore cached libaether
      id: cache-libaether-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Build libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-aether.sh

    - name: Save libaether
      if: steps.cache-libaether-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs-aether
        key: libaether-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app
        cp -r ${{ github.workspace }}/libs-aether/. ${{ github.workspace }}/V2rayNG/app/libs/

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    # patterniha's prebuilt aar is built with -androidapi 29 from v26.10.8 on, which would
    # cut every Android 7-9 phone off (the app is minSdk 24). Same source, same go.mod, same
    # flags, only the api level differs, so we build it here and cache it per submodule commit.
    - name: Restore cached libv2ray
      id: cache-libv2ray-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libv2ray-out
        key: libv2ray-api24-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/AndroidLibXrayLite/HEAD') }}

    - name: Setup Go for libv2ray
      if: steps.cache-libv2ray-restore.outputs.cache-hit != 'true'
      uses: actions/setup-go@v6
      with:
        go-version-file: 'AndroidLibXrayLite/go.mod'
        cache: false

    - name: Build libv2ray (androidapi 24)
      if: steps.cache-libv2ray-restore.outputs.cache-hit != 'true'
      env:
        ANDROID_NDK_HOME: ${{ env.NDK_HOME }}
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH=$PATH:$(go env GOPATH)/bin
        pushd AndroidLibXrayLite
        mkdir -p assets data
        bash gen_assets.sh download
        cp -v data/*.dat assets/
        gomobile init
        go mod tidy
        gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./
        popd
        mkdir -p libv2ray-out
        cp -v AndroidLibXrayLite/libv2ray.aar libv2ray-out/

    - name: Save libv2ray
      if: steps.cache-libv2ray-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libv2ray-out
        key: libv2ray-api24-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/AndroidLibXrayLite/HEAD') }}

    - name: Check libv2ray
      run: |
        cp -v libv2ray-out/libv2ray.aar V2rayNG/app/libs/
        api=$(unzip -p V2rayNG/app/libs/libv2ray.aar AndroidManifest.xml | grep -o 'minSdkVersion="[0-9]*"' | grep -o '[0-9]*')
        echo "libv2ray minSdk: $api"
        [ "$api" -le 24 ] || { echo "libv2ray.aar needs minSdk $api, the app is minSdk 24"; exit 1; }
        unzip -o -q V2rayNG/app/libs/libv2ray.aar jni/arm64-v8a/libgojni.so -d /tmp/alx
        for p in transport/internet/xdrive transport/internet/masque proxy/masque; do
          grep -q "github.com/xtls/xray-core/$p" /tmp/alx/jni/arm64-v8a/libgojni.so || { echo "core is missing $p"; exit 1; }
        done
        echo "core has xdrive + masque"

    - name: Setup Java
      uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build APK
      run: |
        set -o pipefail
        {
          cd ${{ github.workspace }}/V2rayNG
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          # The JVM unit tests are the only automated check of the Kotlin logic; a failure stops the
          # build before anything is assembled or signed.
          ./gradlew :app:testPlaystoreDebugUnitTest
          ./gradlew licenseFdroidReleaseReport
          ./gradlew assembleRelease -PappVersion="${{ inputs.release_tag }}" -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}
        } 2>&1 | tee build-log.txt

    # XDriveFmtTest writes the XDRIVE configs the app builds and repairs. Here they run through
    # the core the app ships (built from the same AndroidLibXrayLite go.mod) against a real
    # WebDAV server, so a release can't carry XDRIVE configs the core refuses or can't move data on.
    - name: Setup Go for the XDRIVE check
      uses: actions/setup-go@v6
      with:
        go-version-file: 'AndroidLibXrayLite/go.mod'
        cache: false

    - name: XDRIVE end-to-end on the shipped core
      run: |
        set -o pipefail
        {
          ( cd AndroidLibXrayLite && GOFLAGS=-mod=mod go build -trimpath -o /tmp/xray github.com/xtls/xray-core/main )
          bash tools/xdrive-e2e/run.sh /tmp/xray V2rayNG/app/build/xdrive-e2e
        } 2>&1 | tee -a build-log.txt

    - name: Save the log where it can be read
      if: failure()
      uses: ./.github/actions/publish-log
      with:
        name: fork
    
    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Collect and (optionally) GPG-sign the APKs
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          find release -type f -name '*.apk' -exec cp {} release-files/ \;

          # A checksum file is always produced. GPG signatures are only produced when a key is
          # configured -- the APKs are already signed with the app's release key, and GPG is a
          # second, separate guarantee about who published the file. Without this guard the whole
          # release job died on an empty secret and nothing was published at all.
          ( cd release-files && sha256sum *.apk > SHA256SUMS )

          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "No GPG key configured; publishing APKs and checksums only."
            exit 0
          fi

          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          for apk in release-files/*.apk; do
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "$apk.sig" "$apk"
          done
          gpg --armor --export "$KEY" > release-files/parsv2r-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          release_name: ParsV2R ${{ inputs.release_tag }}
          body: "."
          target_commit: ${{ github.sha }}
          file_glob: true
          prerelease: true
          overwrite: true
